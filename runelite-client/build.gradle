 *
 * This project uses @Incubating APIs which are subject to change.
 */
plugins {
	id 'buildlogic.java-conventions'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

description = 'RuneLite Client'

dependencies {
	implementation group: 'com.google.inject.extensions', name: 'guice-multibindings', version: '4.1.0', {
		exclude group: 'com.google.inject'
	}
	api libs.org.slf4j.slf4j.api
	api libs.ch.qos.logback.logback.classic
	api libs.net.sf.jopt.simple.jopt.simple
	api libs.com.google.guava.guava
	api libs.com.google.inject.guice
	api libs.com.google.code.gson.gson
	api libs.net.runelite.flatlaf
	api libs.org.apache.commons.commons.text
	api libs.net.runelite.archive.patcher.archive.patcher.applier
	api libs.net.java.dev.jna.jna
	api libs.net.java.dev.jna.jna.platform
	api libs.com.google.code.findbugs.jsr305
	api libs.com.google.protobuf.protobuf.javalite
	api libs.net.runelite.rlawt
	api libs.org.lwjgl.lwjgl
	api libs.org.lwjgl.lwjgl.opengl
	api libs.org.lwjgl.lwjgl.opencl
	api project(':runelite-api')
	api project(':jshell')
	api libs.net.runelite.arn.http.api
	api libs.net.runelite.discord
	api "org.json:json:20240303"
	runtimeOnly libs.org.lwjgl.lwjgl
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl) { classifier("natives-linux") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl) { classifier("natives-macos") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl) { classifier("natives-macos-arm64") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl) { classifier("natives-windows") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl) { classifier("natives-windows-x86") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl) { classifier("natives-windows-arm64") })
	runtimeOnly libs.org.lwjgl.lwjgl.opengl
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl.opengl) { classifier("natives-linux") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl.opengl) { classifier("natives-macos") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl.opengl) { classifier("natives-macos-arm64") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl.opengl) { classifier("natives-windows") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl.opengl) { classifier("natives-windows-x86") })
		runtimeOnly(variantOf(libs.org.lwjgl.lwjgl.opengl) { classifier("natives-windows-arm64") })
	testImplementation libs.junit.junit
	testImplementation libs.org.hamcrest.hamcrest.library
	testImplementation libs.org.mockito.mockito.core
	testImplementation libs.com.google.inject.myextensions.guice.testlib
	testImplementation libs.com.google.inject.myextensions.guice.grapher
	testImplementation libs.com.squareup.okhttp3.mockwebserver
	testImplementation libs.org.projectlombok.lombok
	compileOnly libs.org.projectlombok.lombok
	annotationProcessor libs.org.projectlombok.lombok
	compileOnly libs.org.jetbrains.annotations
	compileOnly libs.net.runelite.orange.myextensions

	implementation(project(":117hd"))
}

// Define the localGitCommit property
def localGitCommit = 'n/a'
try {
	def grgit = org.ajoberstar.grgit.Grgit.open([dir: rootProject.projectDir.absolutePath])
	localGitCommit = grgit.head().id
} catch (Exception e) {
	// Handle the exception if needed
}

project.ext.gitCommit = localGitCommit
apply plugin: BootstrapPlugin

tasks.register("RuneLite.main()", JavaExec.class) {
	classpath = project.sourceSets.main.runtimeClasspath
	workingDir = rootDir
  mainClass = "net.runelite.client.RuneLite"
	jvmArgs = ["--add-opens=java.base/java.lang=ALL-UNNAMED"]
}

jar {
 manifest {
  attributes("Main-Class": "net.runelite.client.RuneLite")
 }
}

shadowJar {
	zip64 = true
}

tasks {
	processResources {
		from "$rootDir/lib/runelite-injected.bin"
		dependsOn("generateInjectedData")
	}
}

tasks.register("generateInjectedData", JavaExec.class) {
	classpath = project(":runelite-injector").sourceSets.main.runtimeClasspath
	workingDir = rootDir
  mainClass = "pl.polishcivil.runelite.injector.Injector"
}

tasks.withType(BootstrapTask) {
	group = "bootstrap"
	gitCommit = project.ext.gitCommit
}
