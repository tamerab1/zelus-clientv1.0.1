name: Build Client

# Publishes the game client and the Karn Beta launcher (Windows / macOS / Linux / universal jar) to the rolling
# `development-latest` GitHub Release on THIS repo, which Launcher.java's CLIENT_URL / CLIENT_SHA_URL / launcher.version
# and the website's Download page point at.
#
# Beta 2026-11-18: Karn Beta branding (KarnBeta-*), macOS (.dmg for Apple Silicon and Intel) and Linux (.AppImage +
# .tar.gz) launchers next to the Windows installer, and the launcher self-update stamp (launcher_version = the build
# number, published as launcher.version). The old Zelus asset names are still uploaded for one transition period so
# links already posted elsewhere keep working.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LAUNCHER_BUILD: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x gradlew

      # The launcher compares this with the release's launcher.version to offer a newer launcher (Launcher.checkLauncherUpdate)
      - name: Stamp the launcher build number
        run: echo "launcher_version=${LAUNCHER_BUILD}" >> runelite-client-launcher/src/main/resources/properties.ini

      - run: ./gradlew --console=plain :client:shadowJar :runelite-client-launcher:shadowJar

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp runelite-client/build/libs/client-*-all.jar release/client.jar
          cp runelite-client-launcher/build/libs/runelite-client-launcher-all.jar release/karn-beta-launcher.jar
          cp release/karn-beta-launcher.jar release/zelus-launcher.jar   # transition: the old asset name
          echo "${LAUNCHER_BUILD}" > release/launcher.version
          cd release
          sha256sum client.jar > client.sha256

      # No-launcher option: client.jar plus a double-clickable script, zipped so they stay together and the .command
      # file keeps its execute bit (GitHub release assets don't keep permissions on loose files; zips do).
      - name: Bundle no-launcher zips
        run: |
          mkdir -p release/win-bundle release/mac-bundle
          cp release/client.jar release/win-bundle/
          cp dist-scripts/run-client.bat release/win-bundle/
          cp release/client.jar release/mac-bundle/
          cp dist-scripts/run-client.command release/mac-bundle/
          chmod +x release/mac-bundle/run-client.command
          (cd release/win-bundle && zip -r ../karn-client-windows.zip .)
          (cd release/mac-bundle && zip -r ../karn-client-mac.zip .)
          cp release/karn-client-windows.zip release/zelus-client-windows.zip
          cp release/karn-client-mac.zip release/zelus-client-mac.zip

      # development-latest is a rolling tag: delete and recreate it each build. The packaging jobs below upload their
      # installers onto this same release afterwards (needs: build), so it must exist by then.
      - name: Publish development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete development-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create development-latest \
            release/client.jar release/client.sha256 release/launcher.version \
            release/karn-beta-launcher.jar release/zelus-launcher.jar \
            release/karn-client-windows.zip release/karn-client-mac.zip \
            release/zelus-client-windows.zip release/zelus-client-mac.zip \
            --repo "${{ github.repository }}" \
            --title "Development Latest" \
            --notes "Automated build ${{ github.run_number }} from commit ${{ github.sha }}" \
            --prerelease

      - name: Upload launcher jar for packaging
        uses: actions/upload-artifact@v4
        with:
          name: launcher-jar
          path: release/karn-beta-launcher.jar

  # jpackage can't cross-compile: every installer is built on its own OS from the launcher jar the build job produced.
  build-windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            runelite-client-launcher/src/main/resources/karn_icon.ico
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: launcher-jar
          path: input

      # jpackage's --type exe needs WiX 3's candle.exe / light.exe on PATH (Chocolatey is preinstalled on the runner).
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Add WiX to PATH
        run: |
          $wixBin = Split-Path (Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" | Select-Object -First 1).FullName
          Write-Output "Found WiX at: $wixBin"
          echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --win-upgrade-uuid MUST stay this exact value forever: it is WiX's UpgradeCode, which lets a new installer
      # replace the old one (including the old Zelus Launcher installs). --app-version is unique per build so the
      # upgrade detection has something to compare (identical versions hit Windows Installer error 1638, 2026-08-10).
      - name: Build Windows installer
        run: |
          jpackage `
            --type exe `
            --name "Karn Beta" `
            --input input `
            --main-jar karn-beta-launcher.jar `
            --main-class runelite.launcher.Launcher `
            --icon runelite-client-launcher\src\main\resources\karn_icon.ico `
            --app-version "1.0.${{ github.run_number }}" `
            --win-upgrade-uuid B2871B0F-6CBC-4306-BF19-4361861C6554 `
            --vendor Karn `
            --description "Karn Beta" `
            --win-shortcut `
            --win-menu `
            --win-menu-group "Karn Beta" `
            --win-dir-chooser `
            --win-per-user-install `
            --dest dist

      - name: Rename installer to match the download page
        run: |
          $built = Get-ChildItem -Path "dist" -Filter "Karn Beta-*.exe" | Select-Object -First 1
          Copy-Item $built.FullName "dist\KarnBeta-windows.exe"
          Copy-Item $built.FullName "dist\ZelusLauncher-windows.exe"

      - name: Upload installer onto the development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload development-latest dist\KarnBeta-windows.exe dist\ZelusLauncher-windows.exe --clobber --repo "${{ github.repository }}"

  # macOS: one .dmg per CPU (jpackage bundles a runtime for the runner's own architecture): macos-15 = Apple Silicon,
  # macos-15-intel = Intel. Unsigned (no Apple Developer ID yet): players right-click > Open the first time.
  build-macos-installer:
    needs: build
    strategy:
      fail-fast: false   # one Mac build failing must not cancel the other
      matrix:
        include:
          - runner: macos-15         # Apple Silicon
            arch: arm64
          - runner: macos-15-intel   # Intel (macos-13 was retired by GitHub and never got a runner)
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            runelite-client-launcher/src/main/resources/karn_icon.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: launcher-jar
          path: input

      - name: Make the .icns icon
        run: |
          src=runelite-client-launcher/src/main/resources/karn_icon.png
          mkdir -p karn.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "karn.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d "$src" --out "karn.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns karn.iconset -o karn.icns

      - name: Build macOS disk image
        run: |
          jpackage \
            --type dmg \
            --name "Karn Beta" \
            --input input \
            --main-jar karn-beta-launcher.jar \
            --main-class runelite.launcher.Launcher \
            --icon karn.icns \
            --app-version "1.0.${{ github.run_number }}" \
            --vendor Karn \
            --description "Karn Beta" \
            --mac-package-identifier com.karnps.launcher \
            --mac-package-name "Karn Beta" \
            --dest dist
          cp dist/*.dmg "dist/KarnBeta-macos-${{ matrix.arch }}.dmg"

      - name: Upload disk image onto the development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload development-latest "dist/KarnBeta-macos-${{ matrix.arch }}.dmg" --clobber --repo "${{ github.repository }}"

  # Linux: a portable app image (.tar.gz, runs anywhere glibc does) and the same app as an .AppImage.
  build-linux-launcher:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            runelite-client-launcher/src/main/resources/karn_icon.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: launcher-jar
          path: input

      - name: Build the app image
        run: |
          jpackage \
            --type app-image \
            --name KarnBeta \
            --input input \
            --main-jar karn-beta-launcher.jar \
            --main-class runelite.launcher.Launcher \
            --icon runelite-client-launcher/src/main/resources/karn_icon.png \
            --app-version "1.0.${{ github.run_number }}" \
            --vendor Karn \
            --description "Karn Beta" \
            --dest dist
          tar -C dist -czf dist/KarnBeta-linux-x64.tar.gz KarnBeta

      - name: Wrap it as an AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 >/dev/null
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          app=KarnBeta.AppDir
          mkdir -p "$app/usr"
          cp -r dist/KarnBeta/* "$app/usr/"
          cp runelite-client-launcher/src/main/resources/karn_icon.png "$app/karn.png"
          printf '[Desktop Entry]\nType=Application\nName=Karn Beta\nExec=KarnBeta\nIcon=karn\nCategories=Game;\n' > "$app/karn.desktop"
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/KarnBeta" "$@"\n' > "$app/AppRun"
          chmod +x "$app/AppRun"
          ARCH=x86_64 ./appimagetool "$app" dist/KarnBeta-linux-x86_64.AppImage

      - name: Upload onto the development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload development-latest dist/KarnBeta-linux-x64.tar.gz dist/KarnBeta-linux-x86_64.AppImage --clobber --repo "${{ github.repository }}"
