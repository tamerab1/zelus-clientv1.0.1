name: Build Client

# Replaces the old .gitlab-ci.yml flow, which published to
# gitlab.com/lexi7133049/client's package registry -- an account Zelus
# doesn't control. Publishes to a GitHub Release on THIS repo instead,
# which Launcher.java's CLIENT_URL/CLIENT_SHA_URL now point at.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew --console=plain :client:shadowJar :runelite-client-launcher:shadowJar

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp runelite-client/build/libs/client-*-all.jar release/client.jar
          cp runelite-client-launcher/build/libs/runelite-client-launcher-all.jar release/zelus-launcher.jar
          cd release
          sha256sum client.jar > client.sha256

      # No-launcher option for players who'd rather not install anything --
      # a double-clickable wrapper next to client.jar instead of making
      # people run a raw jar (which, depending on file associations, can
      # just open in an archive tool like WinRAR instead of doing anything,
      # confusing for anyone who doesn't know to invoke it via `java -jar`
      # from a terminal). Zipped (not loose files) so the script and jar
      # can't end up separated in different folders after download, and so
      # the .command file's execute bit survives the download intact --
      # GitHub release assets don't preserve permissions on loose files,
      # but a zip's internal permissions come through fine on extract.
      - name: Bundle no-launcher zips
        run: |
          mkdir -p release/win-bundle release/mac-bundle
          cp release/client.jar release/win-bundle/
          cp dist-scripts/run-client.bat release/win-bundle/
          cp release/client.jar release/mac-bundle/
          cp dist-scripts/run-client.command release/mac-bundle/
          chmod +x release/mac-bundle/run-client.command
          (cd release/win-bundle && zip -r ../zelus-client-windows.zip .)
          (cd release/mac-bundle && zip -r ../zelus-client-mac.zip .)

      # development-latest is a rolling tag, not a versioned release -- delete
      # and recreate each time so `gh release create` doesn't fail on an
      # already-existing tag/assets from the previous build. The
      # build-windows-installer job below uploads its own asset onto this
      # same release afterwards (needs: build), so it must exist by then.
      - name: Publish development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete development-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create development-latest \
            release/client.jar release/client.sha256 release/zelus-launcher.jar \
            release/zelus-client-windows.zip release/zelus-client-mac.zip \
            --repo "${{ github.repository }}" \
            --title "Development Latest" \
            --notes "Automated dev build from commit ${{ github.sha }}" \
            --prerelease

      - name: Upload launcher jar for Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: launcher-jar
          path: release/zelus-launcher.jar

  # jpackage can't cross-compile a Windows installer from Linux -- this has
  # to run on an actual Windows machine. Downloads the launcher jar the
  # `build` job already produced rather than rebuilding the whole Gradle
  # project a second time; only needs the one jar plus the icon resource.
  build-windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            runelite-client-launcher/src/main/resources/zelus_icon.ico
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: launcher-jar
          path: input

      # GitHub-hosted windows-latest runners have Chocolatey preinstalled;
      # jpackage's --type exe needs WiX 3's candle.exe/light.exe on PATH.
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      # Don't hardcode the version-numbered install dir (e.g. "v3.14") --
      # the chocolatey package version drifts over time and would silently
      # break this path. Find wherever candle.exe actually landed instead.
      - name: Add WiX to PATH
        run: |
          $wixBin = Split-Path (Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" | Select-Object -First 1).FullName
          Write-Output "Found WiX at: $wixBin"
          echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --win-upgrade-uuid MUST stay this exact, fixed value forever -- it's
      # WiX's UpgradeCode, the thing that tells Windows Installer "this new
      # MSI is a newer version of that same product, please replace it" on
      # install. Without it, jpackage derives ProductCode/UpgradeCode from
      # --name + --app-version, so two builds sharing a version (as every
      # build did before this fix, all hardcoded to 1.0.0) get IDENTICAL
      # ids and Windows Installer rejects the second one outright with
      # error 1638 ("another version of this product is already
      # installed") instead of upgrading -- confirmed live 2026-08-10: a
      # July 25 test install silently blocked every subsequent install,
      # including the player-facing one, with no visible error to the
      # user (the installer just appeared to do nothing). --app-version is
      # now unique per build (github.run_number) specifically so this
      # UUID's upgrade detection has something to compare against; a
      # stable UUID with a version that never changes would hit the exact
      # same 1638 bug.
      - name: Build Windows installer
        run: |
          jpackage `
            --type exe `
            --name ZelusLauncher `
            --input input `
            --main-jar zelus-launcher.jar `
            --main-class runelite.launcher.Launcher `
            --icon runelite-client-launcher\src\main\resources\zelus_icon.ico `
            --app-version "1.0.${{ github.run_number }}" `
            --win-upgrade-uuid B2871B0F-6CBC-4306-BF19-4361861C6554 `
            --vendor Zelus `
            --description "Zelus RSPS Launcher" `
            --win-shortcut `
            --win-menu `
            --win-menu-group "Zelus" `
            --win-dir-chooser `
            --win-per-user-install `
            --dest dist

      # Filename varies with --app-version now (e.g. ZelusLauncher-1.0.42.exe)
      # -- find whatever jpackage actually produced instead of hardcoding it.
      - name: Rename installer to match download page
        run: |
          $built = Get-ChildItem -Path "dist" -Filter "ZelusLauncher-*.exe" | Select-Object -First 1
          Copy-Item $built.FullName "dist\ZelusLauncher-windows.exe"

      - name: Upload installer onto the development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload development-latest dist\ZelusLauncher-windows.exe --clobber --repo "${{ github.repository }}"
