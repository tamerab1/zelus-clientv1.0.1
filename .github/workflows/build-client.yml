name: Build Client

# Replaces the old .gitlab-ci.yml flow, which published to
# gitlab.com/lexi7133049/client's package registry -- an account Zelus
# doesn't control. Publishes to a GitHub Release on THIS repo instead,
# which Launcher.java's CLIENT_URL/CLIENT_SHA_URL now point at.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew --console=plain :client:shadowJar :runelite-client-launcher:shadowJar

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp runelite-client/build/libs/client-*-all.jar release/client.jar
          cp runelite-client-launcher/build/libs/runelite-client-launcher-all.jar release/zelus-launcher.jar
          cd release
          sha256sum client.jar > client.sha256

      # development-latest is a rolling tag, not a versioned release -- delete
      # and recreate each time so `gh release create` doesn't fail on an
      # already-existing tag/assets from the previous build. The
      # build-windows-installer job below uploads its own asset onto this
      # same release afterwards (needs: build), so it must exist by then.
      - name: Publish development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete development-latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create development-latest \
            release/client.jar release/client.sha256 release/zelus-launcher.jar \
            --repo "${{ github.repository }}" \
            --title "Development Latest" \
            --notes "Automated dev build from commit ${{ github.sha }}" \
            --prerelease

      - name: Upload launcher jar for Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: launcher-jar
          path: release/zelus-launcher.jar

  # jpackage can't cross-compile a Windows installer from Linux -- this has
  # to run on an actual Windows machine. Downloads the launcher jar the
  # `build` job already produced rather than rebuilding the whole Gradle
  # project a second time; only needs the one jar plus the icon resource.
  build-windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            runelite-client-launcher/src/main/resources/zelus_icon.ico
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: launcher-jar
          path: input

      # GitHub-hosted windows-latest runners have Chocolatey preinstalled;
      # jpackage's --type exe needs WiX 3's candle.exe/light.exe on PATH.
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      # Don't hardcode the version-numbered install dir (e.g. "v3.14") --
      # the chocolatey package version drifts over time and would silently
      # break this path. Find wherever candle.exe actually landed instead.
      - name: Add WiX to PATH
        run: |
          $wixBin = Split-Path (Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" | Select-Object -First 1).FullName
          Write-Output "Found WiX at: $wixBin"
          echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer
        run: |
          jpackage `
            --type exe `
            --name ZelusLauncher `
            --input input `
            --main-jar zelus-launcher.jar `
            --main-class runelite.launcher.Launcher `
            --icon runelite-client-launcher\src\main\resources\zelus_icon.ico `
            --app-version 1.0.0 `
            --vendor Zelus `
            --description "Zelus RSPS Launcher" `
            --win-shortcut `
            --win-menu `
            --win-menu-group "Zelus" `
            --win-dir-chooser `
            --win-per-user-install `
            --dest dist

      - name: Rename installer to match download page
        run: Copy-Item "dist\ZelusLauncher-1.0.0.exe" "dist\ZelusLauncher-windows.exe"

      - name: Upload installer onto the development-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload development-latest dist\ZelusLauncher-windows.exe --clobber --repo "${{ github.repository }}"
