name: CI

# Leftover from before the GitLab -> GitHub migration -- ./ci/build.sh no
# longer exists in this repo, so this failed on every push regardless of
# what changed. build-client.yml (triggered on push to main) is the real
# build/release pipeline now. Kept but disabled rather than deleted, same
# pattern as the monorepo's retired deploy-development job.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      - name: Cache glslang
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build and Test
        run: ./ci/build.sh
