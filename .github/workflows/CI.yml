name: CI

# Leftover from before the GitLab -> GitHub migration -- ./ci/build.sh no
# longer exists in this repo, so this failed on every push regardless of
# what changed. build-client.yml (triggered on push to main) is the real
# build/release pipeline now. Kept but disabled rather than deleted, same
# pattern as the monorepo's retired deploy-development job.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('**/pom.xml', '**/build.sh', '**/pmd-ruleset.xml') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build
        run: ./ci/build.sh
